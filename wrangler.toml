name = "checkin"
main = "src/index.ts"
compatibility_date = "2024-08-13"

[vars]
SCHEDULE_WINDOWS = "09:00-11:00,13:00-15:00,17:00-19:00"
BASE_URL = "http://127.0.0.1:8787"

[[d1_databases]]
binding = "DB"
database_name = "checkin"
database_id = "local-checkin-db"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]
